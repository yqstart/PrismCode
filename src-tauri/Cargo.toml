[package]
name = "prismcode"
version = "3.1.0"
description = "Prism Code — 轻量化桌面代码编辑器"
authors = ["PrismCode"]
edition = "2021"
license = "MIT"

[lib]
name = "prismcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
test = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
walkdir = "2.5.0"
git2 = { version = "0.21.0", features = ["vendored-libgit2", "vendored-openssl", "https", "ssh"] }
regex = "1.13.1"
ignore = "0.4.31"
chrono = "0.4.45"
tauri-plugin-pty = "0.3.1"
ssh2 = { version = "0.9.4", features = ["vendored-openssl"] }
base64 = "0.22"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "macros", "process", "io-util", "sync"] }

# tauri-plugin-pty 0.3.1 的 read/exitstatus 命令包含同步阻塞 IO；使用本地补丁
# 将这些操作移到 blocking 线程池，避免常驻终端占满 Tauri 的异步运行时。
[patch.crates-io]
tauri-plugin-pty = { path = "vendor/tauri-plugin-pty" }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow", "NSView", "NSButton", "NSPasteboard", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSArray", "NSString", "NSURL", "NSDictionary", "NSSet", "NSFileWrapper", "NSData", "NSError"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5", features = ["std"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# Release 构建：LTO + 单 codegen 单元，二进制更小、启动更快（构建时间略增）
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
