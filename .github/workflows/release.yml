# 多平台打包并上传到 GitHub Release
# 触发：推送 v* 标签，或 Actions 页手动 Run workflow
# 说明：无需本机 Windows/Linux；签名/公证可后置（当前产出未签名包）

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "手动补包时选择目标平台"
        required: false
        default: all
        type: choice
        options:
          - all
          - linux

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest = Apple Silicon；原生构建，无需交叉编译
          - name: macOS Apple Silicon
            platform: macos-latest
            args: ""
            rust_targets: ""
          # macos-15-intel = 官方 Intel runner；避免在 ARM 上交叉编译导致 openssl-sys 找不到
          - name: macOS Intel
            platform: macos-15-intel
            args: ""
            rust_targets: ""
          - name: Linux x64
            platform: ubuntu-24.04
            args: ""
            rust_targets: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Select build target
        id: select
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          if [[ "$RELEASE_EVENT" != "workflow_dispatch" || "$REQUESTED_PLATFORM" == "all" || ("$REQUESTED_PLATFORM" == "linux" && "$MATRIX_NAME" == "Linux x64") ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.select.outputs.run == 'true'

      - name: Install Linux dependencies
        if: steps.select.outputs.run == 'true' && matrix.platform == 'ubuntu-24.04'
        run: |
          timeout 180s sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          # GitHub 托管 runner 的 Azure Ubuntu 镜像偶发限速；首次安装 WebKit
          # 依赖可能需要超过 5 分钟，给完整包集留出足够时间。
          timeout 1200s sudo apt-get install -y \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: pnpm/action-setup@v5
        if: steps.select.outputs.run == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v5
        if: steps.select.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        if: steps.select.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        if: steps.select.outputs.run == 'true'
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        if: steps.select.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # 从 CHANGELOG.md 生成 Release 正文（变更项 + 安装说明），与应用内「新功能」同源
      - name: Prepare release notes
        id: notes
        if: steps.select.outputs.run == 'true'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BODY_FILE="$RUNNER_TEMP/release-notes.md"
          node scripts/release-notes.mjs "$VERSION" > "$BODY_FILE"
          {
            echo "body<<__MIRO_RELEASE_NOTES__"
            cat "$BODY_FILE"
            echo "__MIRO_RELEASE_NOTES__"
          } >> "$GITHUB_OUTPUT"

      # 可选：配置 Windows 代码签名证书后，Release 构建会自动 Authenticode 签名，消除 SmartScreen「不安全」提示
      - name: Import Windows code signing certificate
        if: steps.select.outputs.run == 'true' && matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "未配置 WINDOWS_CERTIFICATE，跳过 Windows 代码签名"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          if (-not $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            $env:WINDOWS_CERTIFICATE_THUMBPRINT = (
              Get-ChildItem Cert:\CurrentUser\My |
              Sort-Object NotAfter -Descending |
              Select-Object -First 1
            ).Thumbprint
          }
          "WINDOWS_SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_CERTIFICATE_THUMBPRINT=$env:WINDOWS_CERTIFICATE_THUMBPRINT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Enable Windows code signing in tauri.conf.json
        if: steps.select.outputs.run == 'true' && matrix.platform == 'windows-latest' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: node
        run: |
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle.windows = {
            ...(config.bundle.windows ?? {}),
            certificateThumbprint: process.env.WINDOWS_CERTIFICATE_THUMBPRINT,
            digestAlgorithm: 'sha256',
            timestampUrl: 'http://timestamp.digicert.com',
          };
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);

      # 若该 tag 已有 Release（如已手建的 v0.1.0），会把产物挂上去；
      # 若没有，则自动创建同名 Release。
      - name: Build and upload to Release
        if: steps.select.outputs.run == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名：仓库 Settings → Secrets 配置（内容为 .secrets/prismcode.key 全文）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Prism Code v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          # 已发布的 Release 须为 false；若希望先审再发，可改为 true（且勿对手动已发布 tag 再跑）
          releaseDraft: false
          prerelease: false
          # 生成 latest.json，供应用内 updater 拉取
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  # 全部平台包上传完成后，改写 latest.json 的资产 url 为国内加速镜像直链。
  # 原因：tauri-action 生成的是 api.github.com 资产端点，匿名访问受限流/风控（403），
  # 中国大陆网络下应用内更新必失败；镜像直链经 ghfast.top 加速，可稳定下载。
  finalize:
    name: Rewrite updater URLs
    needs: publish
    runs-on: ubuntu-latest
    if: always() && needs.publish.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rewrite latest.json asset URLs to mirror
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/rewrite-updater-urls.mjs "v$(node -p "require('./package.json').version")"
